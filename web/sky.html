<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Planetario - Osservatorio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; }
    .header {
      padding: 1rem; background: #222; border-bottom: 2px solid #0088ff;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 { font-size: 1.5rem; }
    .nav { display: flex; gap: 0.5rem; }
    .nav a { padding: 0.5rem 1rem; background: #0088ff; color: #fff; text-decoration: none; border-radius: 4px; }
    .nav a:hover { background: #0066cc; }
    .container { display: flex; height: calc(100vh - 60px); }
    .canvas-wrapper { flex: 1; background: #0a0a0a; position: relative; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
    .sidebar {
      width: 300px; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto;
      padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
    }
    /* Night mode UI */
    body.night { background: #0b0101; color: #fdd; }
    body.night .header { background: #160202; border-bottom-color: #b22; }
    body.night .nav a { background: #661111; }
    body.night .nav a:hover { background: #771515; }
    body.night .canvas-wrapper { background: #080101; }
    body.night .controls { background: #160202; }
    body.night .controls input, body.night .controls button { background: #210404; border-color: #4a0f0f; color: #fbb; }
    body.night .controls button:hover { background: #661111; }
    body.night .info { background: #160202; }
    body.night .star-item { background: #210404; }
    body.night .msg { background: #3a0b0b; color: #f99; }
    .controls {
      background: #222; padding: 1rem; border-radius: 4px;
    }
    .controls label { display: block; font-size: 0.9rem; margin: 0.5rem 0; }
    .controls input, .controls button {
      width: 100%; padding: 0.5rem; margin: 0.5rem 0; background: #333; color: #fff; border: 1px solid #555;
      border-radius: 4px; font-size: 0.9rem; cursor: pointer;
    }
    .controls .row { display: flex; gap: .5rem; align-items: center; }
    .controls .row > * { flex: 1; }
    .controls input[type="checkbox"] { width: auto; cursor: pointer; }
    .controls input[type="range"] { width: 100%; }
    .controls input:focus, .controls button:focus { outline: none; border-color: #0088ff; }
    .controls button:hover { background: #0088ff; color: #fff; }
    .controls .section { margin: 1rem 0; padding-top: 0.5rem; border-top: 1px solid #444; }
    .controls .section:first-child { border-top: none; margin-top: 0; }
    .info {
      background: #222; padding: 1rem; border-radius: 4px; font-size: 0.85rem;
      max-height: 300px; overflow-y: auto;
    }
    .info h3 { margin-bottom: 0.5rem; color: #0088ff; }
    .info p { margin: 0.25rem 0; }
    .info .star-list { margin-top: 0.5rem; max-height: 500px; overflow-y: auto; }
    .star-item {
      padding: 0.5rem; background: #333; margin: 0.25rem 0; border-radius: 3px;
      cursor: pointer; transition: background 0.2s;
    }
    .star-item:hover { background: #0088ff; }
    .star-item small { display: block; color: #aaa; font-size: 0.75rem; }
    .msg { padding: 0.5rem; background: #1f4788; color: #adf; border-radius: 3px; margin: 0.5rem 0; }
    .msg.err { background: #881f1f; color: #faa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Sky Planetario</h1>
    <div class="nav">
      <a href="/ui/index.html">Home</a>
      <a href="/ui/control.html">Controllo</a>
      <a href="/ui/align.html">Allineamento</a>
    </div>
  </div>

  <div class="container">
    <div class="canvas-wrapper">
      <canvas id="sky" width="1200" height="600"></canvas>
      <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px; font-size: 0.85rem;">
        <div id="cursor-info">Alt/Az: -- --</div>
        <div id="center-info" style="margin-top: 5px; font-size: 0.75rem; color: #aaa;">Center RA/Dec: --</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="controls">
        <h3>Controlli</h3>
        <label>RA Deg:</label>
        <input type="number" id="ra-input" step="0.1" value="0">
        <label>Dec Deg:</label>
        <input type="number" id="dec-input" step="0.1" value="0">
        <label>Raggio (°):</label>
        <input type="number" id="radius-input" step="5" value="60" min="5" max="180">
        <label>Mag max:</label>
        <input type="number" id="mag-input" step="0.5" value="5" min="0" max="10">
        <button id="load-btn">Carica Stelle</button>
        <button id="zenith-btn">↑ Zenit</button>
        <div class="row">
          <label for="fov-input" style="flex:0 0 auto;">FOV (°):</label>
          <input type="number" id="fov-input" step="0.1" value="2.0" min="0.1" max="60">
        </div>
        <div class="row">
          <label for="follow-checkbox" style="flex:0 0 auto;">Segui Montatura</label>
          <input type="checkbox" id="follow-checkbox" checked>
        </div>
        <div class="row">
          <button id="center-mount-btn">Centra su Montatura</button>
          <button id="reset-pan-btn">Reset Pan</button>
        </div>
        <div class="row">
          <label for="night-checkbox" style="flex:0 0 auto;">Modalità Notte</label>
          <input type="checkbox" id="night-checkbox">
        </div>
        <hr style="border-color:#333; margin: .75rem 0;">
        
        <div class="section">
          <h3 style="margin-bottom: 0.5rem; font-size: 0.95rem;">Configurazione Cielo</h3>
          <div class="row">
            <label for="show-below-horizon" style="flex:0 0 auto;">Stelle sotto orizzonte</label>
            <input type="checkbox" id="show-below-horizon">
          </div>
          <label for="density-slider">Densità stelle: <span id="density-value">1.0</span></label>
          <input type="range" id="density-slider" min="0.1" max="1.0" step="0.1" value="1.0">
          <label for="label-mag-threshold">Soglia etichette (Mag):</label>
          <input type="number" id="label-mag-threshold" step="0.5" value="3.0" min="0" max="10">
          <button id="save-sky-config-btn">Salva Configurazione</button>
        </div>
        
        <div class="section">
          <h3 style="margin-bottom: 0.5rem; font-size: 0.95rem;">Tempo Simulato</h3>
          <label for="time-control">Orario:</label>
          <div class="row">
            <input type="datetime-local" id="time-control" style="flex: 2;">
            <button id="time-now-btn" style="flex: 1; white-space: nowrap;">Adesso</button>
          </div>
          <div class="row">
            <button id="time-play-btn" style="flex: 1;">▶ Play</button>
            <button id="time-stop-btn" style="flex: 1;">■ Stop</button>
          </div>
          <label for="time-speed">Velocità simulazione:</label>
          <input type="range" id="time-speed" min="0.1" max="10" step="0.1" value="1">
          <small style="color: #aaa; display: block; margin-top: 0.25rem;">1x = tempo reale, 2x = 2x più veloce</small>
        </div>

        <hr style="border-color:#333; margin: .75rem 0;">
        <label>Cerca oggetto:</label>
        <div class="row">
          <input type="text" id="search-input" placeholder="M42, Vega, SAO ..." style="flex:2;">
          <button id="search-btn" style="flex:1;">Cerca</button>
        </div>
      </div>

      <div class="info">
        <h3>Informazioni</h3>
        <div id="status"></div>
        <div id="msg"></div>
        <div class="star-list" id="star-list"></div>
        <div class="star-list" id="search-list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    const raInput = document.getElementById('ra-input');
    const decInput = document.getElementById('dec-input');
    const radiusInput = document.getElementById('radius-input');
    const magInput = document.getElementById('mag-input');
    const loadBtn = document.getElementById('load-btn');
    const zenithBtn = document.getElementById('zenith-btn');
    const statusDiv = document.getElementById('status');
    const msgDiv = document.getElementById('msg');
    const starList = document.getElementById('star-list');
    const searchList = document.getElementById('search-list');
    const cursorInfo = document.getElementById('cursor-info');
    const centerInfo = document.getElementById('center-info');
    const fovInput = document.getElementById('fov-input');
    const followCheckbox = document.getElementById('follow-checkbox');
    const centerMountBtn = document.getElementById('center-mount-btn');
    const resetPanBtn = document.getElementById('reset-pan-btn');
    const nightCheckbox = document.getElementById('night-checkbox');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const showBelowHorizonCheckbox = document.getElementById('show-below-horizon');
    const densitySlider = document.getElementById('density-slider');
    const densityValue = document.getElementById('density-value');
    const labelMagThresholdInput = document.getElementById('label-mag-threshold');
    const saveSkyConfigBtn = document.getElementById('save-sky-config-btn');
    const timeControl = document.getElementById('time-control');
    const timeNowBtn = document.getElementById('time-now-btn');
    const timePlayBtn = document.getElementById('time-play-btn');
    const timeStopBtn = document.getElementById('time-stop-btn');
    const timeSpeedInput = document.getElementById('time-speed');

    let stars = [];
    let centerRa = 0, centerDec = 0;
    let panX = 0, panY = 0;
    let zoom = 1;
    const pxPerDeg = 8; // pixel per degree
    let dragging = false, lastX = 0, lastY = 0;
    let mountAltAz = null; // {alt, az}
    let mountTimer = null;
    let highlightTargets = []; // [{alt, az, name}]
    let nightMode = false;
    let constellationsSegments = []; // [{name, segments:[{from:{alt,az}, to:{alt,az}}]}]
    let skyConfig = {}; // Sky configuration from API
    let simulatedTime = null; // null = real time, otherwise Unix timestamp
    let timePlayInterval = null; // setInterval handle for time simulation
    let timePlaySpeed = 1; // Playback speed multiplier

    // Stereographic projection Alt/Az -> x,y
    function altaz_to_xy(alt, az) {
      const altR = Math.radians(alt);
      const azR = Math.radians(az);
      const rho = (90 - alt) * pxPerDeg * zoom;
      const x = canvas.width / 2 + panX + rho * Math.sin(azR);
      const y = canvas.height / 2 - panY - rho * Math.cos(azR);
      return { x, y };
    }

    function xy_to_altaz(x, y) {
      const px = x - canvas.width / 2 - panX;
      const py = canvas.height / 2 + panY - y;
      const rho = Math.sqrt(px * px + py * py) / (pxPerDeg * zoom);
      const alt = 90 - rho;
      let az = Math.atan2(px, py) * 180 / Math.PI;
      if (az < 0) az += 360;
      return { alt, az };
    }

    function raStrToDeg(raStr) {
      // HH:MM:SS
      try {
        const [hh, mm, ss] = raStr.split(':').map(parseFloat);
        return (hh + mm/60 + ss/3600) * 15.0;
      } catch { return NaN; }
    }

    function decStrToDeg(decStr) {
      // sDD*MM:SS
      try {
        const sign = decStr.startsWith('-') ? -1 : 1;
        const body = decStr.substring(1);
        const [dStr, rest] = body.split('*');
        const [mStr, sStr] = rest.split(':');
        return sign * (parseFloat(dStr) + parseFloat(mStr)/60 + parseFloat(sStr)/3600);
      } catch { return NaN; }
    }

    async function pollMount() {
      try {
        const resp = await fetch(`${API_BASE}/status`);
        const data = await resp.json();
        if (!data.ok) return;
        const ra_deg = raStrToDeg(data.ra);
        const dec_deg = decStrToDeg(data.dec);
        const conv = await fetch(`${API_BASE}/altaz`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ra_deg, dec_deg })
        });
        const convData = await conv.json();
        if (convData.ok) {
          mountAltAz = { alt: convData.alt_deg, az: convData.az_deg };
          if (followCheckbox.checked && mountAltAz) {
            // Keep mount near center (soft follow)
            const pos = altaz_to_xy(mountAltAz.alt, mountAltAz.az);
            const dx = (canvas.width / 2) - pos.x;
            const dy = (canvas.height / 2) - pos.y;
            panX += dx * 0.5;
            panY += -dy * 0.5; // invert because screen y
          }
          draw();
        }
      } catch (e) {
        // ignore errors
      }
    }

    async function loadStars() {
      msgDiv.innerHTML = '';
      const ra = parseFloat(raInput.value);
      const dec = parseFloat(decInput.value);
      const radius = parseFloat(radiusInput.value);
      const maxmag = parseFloat(magInput.value);
      const showBelowHorizon = showBelowHorizonCheckbox.checked ? 'true' : 'false';
      const density = parseFloat(densitySlider.value);
      const timestamp = simulatedTime ? (simulatedTime / 1000) : null; // Convert to Unix timestamp
      centerRa = ra;
      centerDec = dec;
      centerInfo.textContent = `Center RA/Dec: ${ra.toFixed(1)}° ${dec.toFixed(1)}°`;
      try {
        let url = `${API_BASE}/sky/stars?ra_deg=${ra}&dec_deg=${dec}&radius=${radius}&maxmag=${maxmag}&show_below_horizon=${showBelowHorizon}&density=${density}`;
        if (timestamp) {
          url += `&timestamp=${timestamp}`;
        }
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.ok) {
          stars = data.stars;
          statusDiv.innerHTML = `<strong>Stelle caricate:</strong> ${stars.length}`;
          renderStarList();
          await loadConstellations();
          draw();
        } else {
          msgDiv.innerHTML = `<div class="msg err">Errore: ${data}</div>`;
        }
      } catch (e) {
        msgDiv.innerHTML = `<div class="msg err">Errore: ${e.message}</div>`;
      }
    }

    async function loadZenith() {
      msgDiv.innerHTML = '';
      raInput.value = '0';
      decInput.value = '0';
      const showBelowHorizon = showBelowHorizonCheckbox.checked ? 'true' : 'false';
      const density = parseFloat(densitySlider.value);
      const timestamp = simulatedTime ? (simulatedTime / 1000) : null;
      try {
        let url = `${API_BASE}/sky/stars?radius=${radiusInput.value}&maxmag=${magInput.value}&show_below_horizon=${showBelowHorizon}&density=${density}`;
        if (timestamp) {
          url += `&timestamp=${timestamp}`;
        }
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.ok) {
          centerRa = data.center_ra;
          centerDec = data.center_dec;
          raInput.value = centerRa.toFixed(1);
          decInput.value = centerDec.toFixed(1);
          stars = data.stars;
          statusDiv.innerHTML = `<strong>Stelle al zenit:</strong> ${stars.length}`;
          centerInfo.textContent = `Center RA/Dec: ${centerRa.toFixed(1)}° ${centerDec.toFixed(1)}°`;
          renderStarList();
          await loadConstellations();
          draw();
        } else {
          msgDiv.innerHTML = `<div class="msg err">Errore: ${data}</div>`;
        }
      } catch (e) {
        msgDiv.innerHTML = `<div class="msg err">Errore: ${e.message}</div>`;
      }
    }

    async function loadConstellations() {
      const showBelowHorizon = showBelowHorizonCheckbox.checked ? 'true' : 'false';
      const timestamp = simulatedTime ? (simulatedTime / 1000) : null;
      let url = `${API_BASE}/sky/constellations?show_below_horizon=${showBelowHorizon}`;
      if (timestamp) {
        url += `&timestamp=${timestamp}`;
      }
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.ok) {
          constellationsSegments = data.constellations || [];
          draw();
        }
      } catch (e) {
        // silenzia errori
      }
    }

    function renderStarList() {
      starList.innerHTML = '';
      const sorted = stars.slice().sort((a, b) => a.mag - b.mag);
      sorted.slice(0, 20).forEach(s => {
        const item = document.createElement('div');
        item.className = 'star-item';
        item.innerHTML = `<strong>${s.name || `RA ${s.ra_deg.toFixed(1)}°`}</strong>
          <small>Alt ${s.alt_deg.toFixed(1)}° Az ${s.az_deg.toFixed(1)}° Mag ${s.mag.toFixed(1)}</small>`;
        item.style.cursor = 'pointer';
        item.addEventListener('click', () => gotoStar(s));
        starList.appendChild(item);
      });
    }

    function draw() {
      // Black background
      ctx.fillStyle = nightMode ? '#080101' : '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw horizon circle
      ctx.strokeStyle = nightMode ? '#551111' : '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(canvas.width / 2 + panX, canvas.height / 2 - panY, 90 * pxPerDeg * zoom, 0, Math.PI * 2);
      ctx.stroke();

      // Draw Alt grid (every 15°)
      ctx.strokeStyle = nightMode ? '#3a0b0b' : '#222';
      ctx.lineWidth = 1;
      for (let alt = 15; alt < 90; alt += 15) {
        const rho = (90 - alt) * pxPerDeg * zoom;
        ctx.beginPath();
        ctx.arc(canvas.width / 2 + panX, canvas.height / 2 - panY, rho, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Draw Az grid (every 30°) and cardinal directions
      ctx.strokeStyle = nightMode ? '#3a0b0b' : '#222';
      ctx.fillStyle = nightMode ? '#aa6666' : '#666';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      const cardinals = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
      for (let az = 0; az < 360; az += 30) {
        const azR = Math.radians(az);
        const x1 = canvas.width / 2 + panX + 90 * pxPerDeg * zoom * Math.sin(azR);
        const y1 = canvas.height / 2 - panY - 90 * pxPerDeg * zoom * Math.cos(azR);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2 + panX, canvas.height / 2 - panY);
        ctx.lineTo(x1, y1);
        ctx.stroke();
        if (cardinals[az]) {
          const label_rho = 100 * pxPerDeg * zoom;
          const lx = canvas.width / 2 + panX + label_rho * Math.sin(azR);
          const ly = canvas.height / 2 - panY - label_rho * Math.cos(azR);
          ctx.fillText(cardinals[az], lx, ly);
        }
      }

      // Draw constellations
      if (constellationsSegments.length > 0) {
        ctx.strokeStyle = nightMode ? 'rgba(255,120,120,0.35)' : 'rgba(64,160,255,0.45)';
        ctx.lineWidth = 1;
        ctx.lineJoin = 'round';
        constellationsSegments.forEach(c => {
          c.segments?.forEach(seg => {
            try {
              const p1 = altaz_to_xy(seg.from.alt, seg.from.az);
              const p2 = altaz_to_xy(seg.to.alt, seg.to.az);
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            } catch (e) {
              // ignore
            }
          });
        });
      }

      // Draw stars
      stars.forEach(s => {
        const pos = altaz_to_xy(s.alt_deg, s.az_deg);
        const mag = s.mag;
        const size = Math.max(2, 5 - mag);
        ctx.fillStyle = nightMode ? '#ff4444' : '#ffff00';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
        ctx.fill();
        // Draw label if magnitude is below threshold
        const labelMagThreshold = parseFloat(labelMagThresholdInput.value || '3.0');
        if (mag < labelMagThreshold) {
          ctx.strokeStyle = nightMode ? '#ff6666' : '#ffff00';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, size + 3, 0, Math.PI * 2);
          ctx.stroke();
          // Draw star name/label
          if (s.name) {
            ctx.fillStyle = nightMode ? '#ff6666' : '#ffff88';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText(s.name, pos.x + 5, pos.y - 3);
          }
        }
      });

      // Draw highlight targets (search)
      highlightTargets.forEach(t => {
        const pos = altaz_to_xy(t.alt, t.az);
        ctx.strokeStyle = nightMode ? '#ff8888' : '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = nightMode ? '#ffbbbb' : '#00ffcc';
        ctx.font = '12px sans-serif';
        ctx.fillText(t.name || '', pos.x + 12, pos.y - 8);
      });

      // Draw mount crosshair
      if (mountAltAz) {
        const pos = altaz_to_xy(mountAltAz.alt, mountAltAz.az);
        ctx.strokeStyle = nightMode ? '#ff4444' : '#ff5555';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pos.x - 10, pos.y);
        ctx.lineTo(pos.x + 10, pos.y);
        ctx.moveTo(pos.x, pos.y - 10);
        ctx.lineTo(pos.x, pos.y + 10);
        ctx.stroke();
        ctx.fillStyle = nightMode ? '#ffaaaa' : '#ff8888';
        ctx.font = '12px sans-serif';
        ctx.fillText('MOUNT', pos.x + 12, pos.y + 12);
      }

      // Draw FOV circle (around center)
      const fov = parseFloat(fovInput.value || '0');
      if (fov > 0) {
        const radiusPx = (fov / 2) * pxPerDeg * zoom;
        ctx.strokeStyle = nightMode ? '#aa4444' : '#4488ff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(canvas.width / 2 + panX, canvas.height / 2 - panY, radiusPx, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function fitZoomToHorizon() {
      const targetRadius = Math.min(canvas.width, canvas.height) * 0.5 - 10; // margin
      const z = targetRadius / (90 * pxPerDeg);
      // Keep within reasonable bounds
      zoom = Math.max(0.2, Math.min(3, z));
    }

    function gotoStar(star) {
      const goto_alt = Math.round(star.alt_deg * 100) / 100;
      const goto_az = Math.round(star.az_deg * 100) / 100;
      msgDiv.innerHTML = `<div class="msg">GOTO ${star.name}: Alt ${goto_alt}° Az ${goto_az}°...</div>`;
      fetch(`${API_BASE}/goto`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alt_deg: goto_alt, az_deg: goto_az })
      }).then(r => r.json()).then(d => {
        if (d.ok) {
          msgDiv.innerHTML = `<div class="msg">GOTO completato: ${d.ra_deg.toFixed(4)}° ${d.dec_deg.toFixed(4)}°</div>`;
        } else {
          msgDiv.innerHTML = `<div class="msg err">Errore GOTO: ${d}</div>`;
        }
      }).catch(e => {
        msgDiv.innerHTML = `<div class="msg err">Errore: ${e.message}</div>`;
      });
    }

    // Canvas events
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const altaz = xy_to_altaz(x, y);
      cursorInfo.textContent = `Alt/Az: ${altaz.alt.toFixed(1)}° ${altaz.az.toFixed(1)}°`;
      if (dragging) {
        panX += (x - lastX);
        panY += (y - lastY) * -1; // invert sense for y
        lastX = x; lastY = y;
        draw();
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
      dragging = true;
    });

    window.addEventListener('mouseup', () => dragging = false);
    canvas.addEventListener('mouseleave', () => dragging = false);

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const altaz = xy_to_altaz(x, y);
      const nearest = stars.reduce((best, s) => {
        const pos = altaz_to_xy(s.alt_deg, s.az_deg);
        const d = Math.sqrt((pos.x - x) ** 2 + (pos.y - y) ** 2);
        return d < 20 && (!best || d < best.dist) ? { star: s, dist: d } : best;
      }, null);
      if (nearest) {
        gotoStar(nearest.star);
      } else {
        msgDiv.innerHTML = `<div class="msg">GOTO Alt ${altaz.alt.toFixed(1)}° Az ${altaz.az.toFixed(1)}°...</div>`;
        fetch(`${API_BASE}/goto`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ alt_deg: altaz.alt, az_deg: altaz.az })
        }).then(r => r.json()).then(d => {
          if (d.ok) {
            msgDiv.innerHTML = `<div class="msg">GOTO completato</div>`;
          } else {
            msgDiv.innerHTML = `<div class="msg err">Errore: ${d}</div>`;
          }
        }).catch(e => {
          msgDiv.innerHTML = `<div class="msg err">Errore: ${e.message}</div>`;
        });
      }
    });

    // Scroll zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.9 : 1.1;
      zoom *= factor;
      draw();
    });

    // Buttons
    loadBtn.addEventListener('click', loadStars);
    zenithBtn.addEventListener('click', loadZenith);

    // Density slider update
    densitySlider.addEventListener('input', () => {
      densityValue.textContent = (parseFloat(densitySlider.value)).toFixed(1);
      loadStars();
    });

    // Show below horizon toggle
    showBelowHorizonCheckbox.addEventListener('change', () => {
      loadStars();
    });

    // Config save
    saveSkyConfigBtn.addEventListener('click', async () => {
      const config = {
        maxmag: parseFloat(magInput.value),
        radius: parseFloat(radiusInput.value),
        show_below_horizon: showBelowHorizonCheckbox.checked,
        label_mag_threshold: parseFloat(labelMagThresholdInput.value),
        density: parseFloat(densitySlider.value)
      };
      try {
        const resp = await fetch(`${API_BASE}/sky/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
        const data = await resp.json();
        if (data.ok) {
          msgDiv.innerHTML = `<div class="msg">Configurazione salvata con successo!</div>`;
          setTimeout(() => msgDiv.innerHTML = '', 3000);
        }
      } catch (e) {
        msgDiv.innerHTML = `<div class="msg err">Errore saving config: ${e.message}</div>`;
      }
    });

    // Time controls
    timeNowBtn.addEventListener('click', () => {
      simulatedTime = null;
      const now = new Date();
      timeControl.value = now.toISOString().slice(0, 16);
      stopTimePlayback();
      loadStars();
    });

    timeControl.addEventListener('change', () => {
      const val = timeControl.value;
      if (!val) {
        simulatedTime = null;
      } else {
        simulatedTime = new Date(val).getTime();
      }
      stopTimePlayback();
      loadStars();
    });

    timePlayBtn.addEventListener('click', () => {
      if (timePlayInterval) return; // Already playing
      const dateStr = timeControl.value;
      if (!dateStr) {
        simulatedTime = null;
      } else {
        simulatedTime = new Date(dateStr).getTime();
      }
      timePlaySpeed = parseFloat(timeSpeedInput.value || 1);
      const deltaMs = 1000; // Update every second
      timePlayInterval = setInterval(() => {
        if (simulatedTime === null) {
          simulatedTime = Date.now();
        }
        simulatedTime += deltaMs * timePlaySpeed;
        const dt = new Date(simulatedTime);
        timeControl.value = dt.toISOString().slice(0, 16);
        loadStars();
      }, deltaMs);
    });

    timeStopBtn.addEventListener('click', stopTimePlayback);

    function stopTimePlayback() {
      if (timePlayInterval) {
        clearInterval(timePlayInterval);
        timePlayInterval = null;
      }
    }

    // Load sky config on startup
    async function loadSkyConfig() {
      try {
        const resp = await fetch(`${API_BASE}/sky/config`);
        const data = await resp.json();
        if (data.ok && data.config) {
          skyConfig = data.config;
          showBelowHorizonCheckbox.checked = skyConfig.show_below_horizon || false;
          densitySlider.value = skyConfig.density || 1.0;
          densityValue.textContent = (skyConfig.density || 1.0).toFixed(1);
          labelMagThresholdInput.value = skyConfig.label_mag_threshold || 3.0;
          magInput.value = skyConfig.maxmag || 5.0;
          radiusInput.value = skyConfig.radius || 60.0;
        }
      } catch (e) {
        console.error('Error loading sky config:', e);
      }
    }

     centerMountBtn.addEventListener('click', () => {
       if (!mountAltAz) return;
       const pos = altaz_to_xy(mountAltAz.alt, mountAltAz.az);
       panX += (canvas.width / 2) - pos.x;
       panY += -((canvas.height / 2) - pos.y);
       draw();
     });

     resetPanBtn.addEventListener('click', () => { panX = 0; panY = 0; draw(); });

     nightCheckbox.addEventListener('change', () => {
       nightMode = !!nightCheckbox.checked;
       document.body.classList.toggle('night', nightMode);
       draw();
     });

     searchBtn.addEventListener('click', async () => {
       const q = (searchInput.value || '').trim();
       searchList.innerHTML = '';
       highlightTargets = [];
       if (!q) return;
       try {
         const r = await fetch(`${API_BASE}/find?name=${encodeURIComponent(q)}&limit=8`);
         const data = await r.json();
         if (!data.ok) return;
         data.results.forEach(async (res) => {
           const item = document.createElement('div');
           item.className = 'star-item';
           item.innerHTML = `<strong>${res.name}</strong><small>RA ${res.ra_deg.toFixed(2)}° Dec ${res.dec_deg.toFixed(2)}° Mag ${res.mag?.toFixed?.(1) ?? '-'}</small>`;
           item.addEventListener('click', async () => {
             try {
               const conv = await fetch(`${API_BASE}/altaz`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ra_deg: res.ra_deg, dec_deg: res.dec_deg }) });
               const convData = await conv.json();
               if (convData.ok) {
                 gotoStar({ name: res.name, alt_deg: convData.alt_deg, az_deg: convData.az_deg });
               }
             } catch {}
           });
           searchList.appendChild(item);
           try {
             const conv = await fetch(`${API_BASE}/altaz`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ra_deg: res.ra_deg, dec_deg: res.dec_deg }) });
             const convData = await conv.json();
             if (convData.ok) {
               highlightTargets.push({ alt: convData.alt_deg, az: convData.az_deg, name: res.name });
               draw();
             }
           } catch {}
         });
       } catch(e) {
         // ignore
       }
     });

    // Init
    window.addEventListener('load', () => { 
      loadSkyConfig();
      fitZoomToHorizon(); 
      const now = new Date();
      timeControl.value = now.toISOString().slice(0, 16);
      loadZenith(); 
    });
    window.addEventListener('load', () => {
      if (mountTimer) clearInterval(mountTimer);
      mountTimer = setInterval(pollMount, 1500);
    });
    window.addEventListener('resize', () => { fitZoomToHorizon(); draw(); });

    // Polyfill for Math.radians
    if (!Math.radians) {
      Math.radians = (d) => d * Math.PI / 180;
    }
  </script>
</body>
</html>
