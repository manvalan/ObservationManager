<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controllo Montatura</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    fieldset { margin-bottom: 1rem; }
    label { display: inline-block; min-width: 110px; }
    input, select, button { margin: .2rem 0; }
    .row { margin: .4rem 0; }
    .status { padding: .5rem; background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; }
    a { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>Controllo Montatura</h1>
  <p><a href="index.html">Home</a></p>

  <fieldset>
    <legend>Connessione</legend>
    <div class="row">
      <label>Porta</label>
      <select id="portSelect"></select>
      <button id="refreshPorts">Aggiorna porte</button>
    </div>
    <div class="row">
      <label>Baud</label>
      <input id="baud" type="number" value="9600" />
      <label>Timeout</label>
      <input id="timeout" type="number" step="0.1" value="2.0" />
      <label>
        <input id="dryRun" type="checkbox" /> Dry run
      </label>
    </div>
    <div class="row">
      <button id="connectBtn">Connetti</button>
      <button id="disconnectBtn">Disconnetti</button>
    </div>
    <div class="row status" id="connStatus"></div>
  </fieldset>

  <fieldset>
    <legend>Stato</legend>
    <div class="row">
      <button id="statusBtn">Aggiorna Stato</button>
    </div>
    <div class="row status" id="status"></div>
  </fieldset>

  <fieldset>
    <legend>GOTO</legend>
    <div class="row">
      <label>RA</label>
      <input id="ra" placeholder="HH:MM:SS oppure gradi" />
    </div>
    <div class="row">
      <label>Dec</label>
      <input id="dec" placeholder="+DD*MM:SS oppure gradi" />
    </div>
    <div class="row">
      <button id="gotoBtn">Vai (GOTO)</button>
    </div>
    <div class="row status" id="gotoRes"></div>
  </fieldset>

  <fieldset>
    <legend>Sync</legend>
    <div class="row">
      <label>RA</label>
      <input id="syncRa" placeholder="HH:MM:SS" />
    </div>
    <div class="row">
      <label>Dec</label>
      <input id="syncDec" placeholder="+DD*MM:SS" />
    </div>
    <div class="row">
      <button id="syncBtn">Sincronizza</button>
    </div>
    <div class="row status" id="syncRes"></div>
  </fieldset>

  <script>
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      return res.json();
    }

    async function loadPorts() {
      const j = await api('/api/ports');
      const sel = document.getElementById('portSelect');
      sel.innerHTML = '';
      j.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p; sel.appendChild(opt);
      });
    }

    function getConnParams() {
      const port = document.getElementById('portSelect').value || null;
      const baud = parseInt(document.getElementById('baud').value || '9600', 10);
      const timeout = parseFloat(document.getElementById('timeout').value || '2.0');
      const dryRun = document.getElementById('dryRun').checked;
      return { port, baud, timeout, dry_run: dryRun };
    }

    async function refreshConnInfo() {
      const j = await api('/api/connection');
      document.getElementById('connStatus').textContent = JSON.stringify(j);
    }

    document.getElementById('refreshPorts').onclick = loadPorts;
    document.getElementById('connectBtn').onclick = async () => {
      try {
        const body = getConnParams();
        const j = await api('/api/connect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        document.getElementById('connStatus').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    };
    document.getElementById('disconnectBtn').onclick = async () => {
      try {
        const j = await api('/api/disconnect', { method: 'POST' });
        document.getElementById('connStatus').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    };

    document.getElementById('statusBtn').onclick = async () => {
      try {
        const j = await api('/api/status');
        document.getElementById('status').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    };

    document.getElementById('gotoBtn').onclick = async () => {
      try {
        const ra = document.getElementById('ra').value.trim();
        const dec = document.getElementById('dec').value.trim();
        const body = {};
        if (ra.includes(':')) body.ra = ra; else if (ra) body.ra_deg = parseFloat(ra);
        if (dec.includes('*') || dec.includes(':') || dec.startsWith('+') || dec.startsWith('-')) body.dec = dec; else if (dec) body.dec_deg = parseFloat(dec);
        const j = await api('/api/goto', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        document.getElementById('gotoRes').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    };

    document.getElementById('syncBtn').onclick = async () => {
      try {
        const ra = document.getElementById('syncRa').value.trim();
        const dec = document.getElementById('syncDec').value.trim();
        const j = await api('/api/sync', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ ra, dec }) });
        document.getElementById('syncRes').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    };

    // Init
    loadPorts().then(refreshConnInfo);
  </script>
</body>
</html>
