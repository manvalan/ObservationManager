<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Control - ObservationManager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    h1 { color: #4fc3f7; margin: 0 0 1rem; }
    
    a {
      color: #4fc3f7;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    
    .container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
      max-width: 1600px;
    }
    
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    
    .panel {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 1rem;
    }
    
    .panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1.1rem;
      color: #81c784;
      border-bottom: 1px solid #444;
      padding-bottom: 0.5rem;
    }
    
    .control-group {
      margin-bottom: 1rem;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
      color: #aaa;
    }
    
    input[type="number"],
    input[type="text"],
    select {
      width: 100%;
      padding: 0.5rem;
      background: #1a1a1a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 0.9rem;
    }
    
    input[type="range"] {
      width: 100%;
    }
    
    button {
      padding: 0.6rem 1rem;
      background: #4fc3f7;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #29b6f6;
    }
    
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    
    button.secondary {
      background: #66bb6a;
    }
    
    button.secondary:hover {
      background: #4caf50;
    }
    
    button.danger {
      background: #ef5350;
    }
    
    button.danger:hover {
      background: #e53935;
    }
    
    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    
    .btn-group button {
      flex: 1;
      min-width: 100px;
    }
    
    #videoPreview {
      width: 100%;
      max-width: 100%;
      border: 2px solid #444;
      border-radius: 8px;
      background: #000;
      display: block;
      min-height: 400px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    
    .stat-box {
      background: #1a1a1a;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #555;
      text-align: center;
    }
    
    .stat-box .label {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }
    
    .stat-box .value {
      font-size: 1.3rem;
      font-weight: 600;
      color: #4fc3f7;
    }
    
    .stat-box .unit {
      font-size: 0.75rem;
      color: #888;
    }
    
    #histogram {
      width: 100%;
      height: 150px;
      background: #1a1a1a;
      border: 1px solid #555;
      border-radius: 4px;
      margin-top: 0.5rem;
    }
    
    .status-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.5rem;
    }
    
    .status-indicator.active {
      background: #66bb6a;
      box-shadow: 0 0 8px #66bb6a;
    }
    
    .status-indicator.inactive {
      background: #757575;
    }
    
    #deviceStatus {
      padding: 0.5rem;
      background: #1a1a1a;
      border-radius: 4px;
      border: 1px solid #555;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .log {
      background: #1a1a1a;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.8rem;
      color: #aaa;
    }
    
    .log-entry {
      margin-bottom: 0.25rem;
      padding: 0.25rem;
      border-left: 2px solid #4fc3f7;
      padding-left: 0.5rem;
    }
    
    .log-entry.error {
      border-left-color: #ef5350;
      color: #ef5350;
    }
    
    .log-entry.success {
      border-left-color: #66bb6a;
      color: #66bb6a;
    }
  </style>
</head>
<body>
  <h1>🎥 Camera Control</h1>
  <p><a href="index.html">← Home</a> | <a href="control.html">Controllo Montatura</a> | <a href="sky.html">Sky Map</a></p>

  <div class="container">
    <!-- Left Panel: Controls -->
    <div>
      <!-- Device Selection -->
      <div class="panel">
        <h2>📷 Device</h2>
        <div id="deviceStatus">
          <span class="status-indicator inactive" id="statusDot"></span>
          <span id="statusText">Nessun device aperto</span>
        </div>
        
        <div class="control-group">
          <label>Device Camera</label>
          <select id="deviceSelect">
            <option value="">-- Scansiona devices --</option>
          </select>
        </div>
        
        <div class="btn-group">
          <button id="btnScanDevices" class="secondary">Scansiona</button>
          <button id="btnOpenDevice">Apri</button>
        </div>
      </div>
      
      <!-- Camera Settings -->
      <div class="panel">
        <h2>⚙️ Impostazioni</h2>
        
        <div class="control-group">
          <label>Esposizione (ms) <span id="expValue">Auto</span></label>
          <input type="range" id="exposure" min="-1" max="100" value="-1" />
        </div>
        
        <div class="control-group">
          <label>Gain <span id="gainValue">Auto</span></label>
          <input type="range" id="gain" min="-1" max="100" value="-1" />
        </div>
        
        <div class="control-group">
          <label>Binning</label>
          <select id="binning">
            <option value="1">1x1 (No binning)</option>
            <option value="2">2x2</option>
            <option value="4">4x4</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Risoluzione</label>
          <select id="resolution">
            <option value="640x480">640 x 480</option>
            <option value="800x600">800 x 600</option>
            <option value="1280x720">1280 x 720 (HD)</option>
            <option value="1920x1080">1920 x 1080 (Full HD)</option>
          </select>
        </div>
        
        <button id="btnApplySettings" class="secondary">Applica Settings</button>
      </div>
      
      <!-- Capture Controls -->
      <div class="panel">
        <h2>📸 Cattura</h2>
        
        <div class="btn-group">
          <button id="btnStartCapture">Start Live</button>
          <button id="btnStopCapture" class="danger">Stop</button>
        </div>
        
        <div class="btn-group" style="margin-top: 0.5rem;">
          <button id="btnCaptureFrame" class="secondary">Snapshot</button>
          <button id="btnSaveFITS" class="secondary">Save FITS</button>
        </div>
        
        <div class="control-group" style="margin-top: 1rem;">
          <label>Nome Target (opzionale)</label>
          <input type="text" id="targetName" placeholder="es. M42" />
        </div>
      </div>
    </div>
    
    <!-- Right Panel: Preview & Stats -->
    <div>
      <!-- Video Preview -->
      <div class="panel">
        <h2>🖼️ Preview</h2>
        <img id="videoPreview" alt="Camera preview" />
      </div>
      
      <!-- Statistics -->
      <div class="panel">
        <h2>📊 Statistiche Immagine</h2>
        
        <div class="stats-grid">
          <div class="stat-box">
            <div class="label">Mean</div>
            <div class="value" id="statMean">--</div>
            <div class="unit">ADU</div>
          </div>
          <div class="stat-box">
            <div class="label">StdDev</div>
            <div class="value" id="statStd">--</div>
            <div class="unit">ADU</div>
          </div>
          <div class="stat-box">
            <div class="label">SNR</div>
            <div class="value" id="statSNR">--</div>
            <div class="unit"></div>
          </div>
          <div class="stat-box">
            <div class="label">FWHM</div>
            <div class="value" id="statFWHM">--</div>
            <div class="unit">px</div>
          </div>
          <div class="stat-box">
            <div class="label">Min</div>
            <div class="value" id="statMin">--</div>
            <div class="unit"></div>
          </div>
          <div class="stat-box">
            <div class="label">Max</div>
            <div class="value" id="statMax">--</div>
            <div class="unit"></div>
          </div>
        </div>
        
        <canvas id="histogram"></canvas>
      </div>
      
      <!-- Log -->
      <div class="panel">
        <h2>📜 Log</h2>
        <div class="log" id="logContainer">
          <div class="log-entry">Camera control pronta</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== State ==========
    let isDeviceOpen = false;
    let isCapturing = false;
    let statsInterval = null;
    
    // ========== Logging ==========
    function log(msg, type = 'info') {
      const container = document.getElementById('logContainer');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${msg}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
      
      // Keep max 50 entries
      while (container.children.length > 50) {
        container.removeChild(container.firstChild);
      }
    }
    
    function updateStatus(text, active) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = active ? 'status-indicator active' : 'status-indicator inactive';
    }
    
    // ========== Device Management ==========
    async function scanDevices() {
      try {
        log('Scansione devices...');
        const resp = await fetch('/api/camera/devices');
        const data = await resp.json();
        
        const select = document.getElementById('deviceSelect');
        select.innerHTML = '<option value="">-- Seleziona device --</option>';
        
        data.devices.forEach(dev => {
          const opt = document.createElement('option');
          opt.value = dev.index;
          opt.textContent = `${dev.name} (${dev.width}x${dev.height}, ${dev.backend})`;
          select.appendChild(opt);
        });
        
        log(`Trovati ${data.count} device(s)`, 'success');
      } catch (err) {
        log(`Errore scan: ${err.message}`, 'error');
      }
    }
    
    async function openDevice() {
      const select = document.getElementById('deviceSelect');
      const index = parseInt(select.value);
      
      if (isNaN(index)) {
        log('Seleziona un device prima', 'error');
        return;
      }
      
      try {
        log(`Apertura device ${index}...`);
        const resp = await fetch(`/api/camera/open?device_index=${index}`, { method: 'POST' });
        const data = await resp.json();
        
        isDeviceOpen = true;
        updateStatus(`Device ${index} aperto (${data.capabilities.width}x${data.capabilities.height})`, true);
        log(`Device aperto: ${data.capabilities.backend}`, 'success');
        
        // Auto-start live view
        startLiveView();
      } catch (err) {
        log(`Errore apertura: ${err.message}`, 'error');
        updateStatus('Errore apertura', false);
      }
    }
    
    // ========== Settings ==========
    function updateSettingsDisplay() {
      const exp = parseInt(document.getElementById('exposure').value);
      const gain = parseInt(document.getElementById('gain').value);
      
      document.getElementById('expValue').textContent = exp < 0 ? 'Auto' : `${exp} ms`;
      document.getElementById('gainValue').textContent = gain < 0 ? 'Auto' : gain;
    }
    
    document.getElementById('exposure').oninput = updateSettingsDisplay;
    document.getElementById('gain').oninput = updateSettingsDisplay;
    
    async function applySettings() {
      if (!isDeviceOpen) {
        log('Apri device prima di modificare settings', 'error');
        return;
      }
      
      const exposure = parseInt(document.getElementById('exposure').value);
      const gain = parseInt(document.getElementById('gain').value);
      const binning = parseInt(document.getElementById('binning').value);
      const [width, height] = document.getElementById('resolution').value.split('x').map(Number);
      
      try {
        log('Applicazione settings...');
        const resp = await fetch('/api/camera/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ exposure, gain, binning, width, height })
        });
        const data = await resp.json();
        
        log('Settings aggiornati', 'success');
      } catch (err) {
        log(`Errore settings: ${err.message}`, 'error');
      }
    }
    
    // ========== Live View ==========
    function startLiveView() {
      const img = document.getElementById('videoPreview');
      img.src = `/api/video.mjpg?camera_index=0&_t=${Date.now()}`;
      log('Live view avviato', 'success');
    }
    
    async function startCapture() {
      try {
        await fetch('/api/camera/start', { method: 'POST' });
        isCapturing = true;
        log('Capture continua avviata', 'success');
        
        // Start stats polling
        startStatsPolling();
      } catch (err) {
        log(`Errore start capture: ${err.message}`, 'error');
      }
    }
    
    async function stopCapture() {
      try {
        await fetch('/api/camera/stop', { method: 'POST' });
        isCapturing = false;
        log('Capture fermata', 'success');
        
        // Stop stats polling
        stopStatsPolling();
      } catch (err) {
        log(`Errore stop capture: ${err.message}`, 'error');
      }
    }
    
    // ========== Statistics ==========
    function startStatsPolling() {
      if (statsInterval) return;
      
      statsInterval = setInterval(async () => {
        try {
          const resp = await fetch('/api/camera/statistics');
          const stats = await resp.json();
          
          document.getElementById('statMean').textContent = stats.mean.toFixed(1);
          document.getElementById('statStd').textContent = stats.std.toFixed(1);
          document.getElementById('statSNR').textContent = stats.snr.toFixed(2);
          document.getElementById('statMin').textContent = stats.min;
          document.getElementById('statMax').textContent = stats.max;
          
          // Update histogram
          drawHistogram(stats.histogram);
          
          // Update FWHM
          const fwhmResp = await fetch('/api/camera/fwhm');
          const fwhmData = await fwhmResp.json();
          document.getElementById('statFWHM').textContent = fwhmData.fwhm > 0 ? fwhmData.fwhm.toFixed(2) : '--';
          
        } catch (err) {
          // Silent fail during polling
        }
      }, 2000);
    }
    
    function stopStatsPolling() {
      if (statsInterval) {
        clearInterval(statsInterval);
        statsInterval = null;
      }
    }
    
    function drawHistogram(data) {
      const canvas = document.getElementById('histogram');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, w, h);
      
      if (!data || data.length === 0) return;
      
      const max = Math.max(...data);
      const barWidth = w / data.length;
      
      ctx.fillStyle = '#4fc3f7';
      data.forEach((val, i) => {
        const barHeight = (val / max) * h;
        ctx.fillRect(i * barWidth, h - barHeight, barWidth, barHeight);
      });
    }
    
    // ========== Capture & Save ==========
    async function captureFrame() {
      try {
        log('Cattura snapshot...');
        const resp = await fetch('/api/camera/capture', { method: 'POST' });
        const data = await resp.json();
        
        log(`Frame catturato: ${data.width}x${data.height}`, 'success');
        
        // Update stats
        const stats = data.statistics;
        document.getElementById('statMean').textContent = stats.mean.toFixed(1);
        document.getElementById('statStd').textContent = stats.std.toFixed(1);
        document.getElementById('statSNR').textContent = stats.snr.toFixed(2);
        drawHistogram(stats.histogram);
      } catch (err) {
        log(`Errore capture: ${err.message}`, 'error');
      }
    }
    
    async function saveFITS() {
      const target = document.getElementById('targetName').value.trim();
      
      try {
        log('Salvataggio FITS...');
        const body = target ? { target } : {};
        
        const resp = await fetch('/api/camera/save-fits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        
        log(`FITS salvato: ${data.filename}`, 'success');
      } catch (err) {
        log(`Errore save FITS: ${err.message}`, 'error');
      }
    }
    
    // ========== Event Handlers ==========
    document.getElementById('btnScanDevices').onclick = scanDevices;
    document.getElementById('btnOpenDevice').onclick = openDevice;
    document.getElementById('btnApplySettings').onclick = applySettings;
    document.getElementById('btnStartCapture').onclick = startCapture;
    document.getElementById('btnStopCapture').onclick = stopCapture;
    document.getElementById('btnCaptureFrame').onclick = captureFrame;
    document.getElementById('btnSaveFITS').onclick = saveFITS;
    
    // Auto-scan on load
    scanDevices();
  </script>
</body>
</html>
