<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cataloghi / Goto per Nome</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .4rem; }
    th { background: #f5f5f5; text-align: left; }
    .row { margin: .4rem 0; }
    .status { padding: .5rem; background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Cataloghi</h1>
  <p><a href="index.html">Home</a> · <a href="control.html">Controllo</a></p>

  <fieldset>
    <legend>Goto per nome</legend>
    <div class="row">
      <input id="nameGoto" placeholder="Es. Vega, Betelgeuse, HD 48915" size="40" />
      <button id="gotoNameBtn">Goto</button>
    </div>
    <div class="status" id="gotoNameRes"></div>
  </fieldset>

  <fieldset>
    <legend>Cerca nel catalogo</legend>
    <div class="row">
      <input id="nameFind" placeholder="Nome o designazione" size="40" />
      <label>Limite</label>
      <input id="limit" type="number" value="5" style="width: 60px" />
      <button id="findBtn">Cerca</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>RA (°)</th>
          <th>Dec (°)</th>
          <th>Mag</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </fieldset>

  <script>
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      return res.json();
    }

    async function find() {
      try {
        const name = encodeURIComponent(document.getElementById('nameFind').value.trim());
        const limit = parseInt(document.getElementById('limit').value || '5', 10);
        const j = await api(`/api/find?name=${name}&limit=${limit}`);
        const tbody = document.getElementById('results');
        tbody.innerHTML = '';
        (j.results || []).forEach((e, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${i+1}</td>
            <td>${e.name}</td>
            <td>${e.ra_deg.toFixed(6)}</td>
            <td>${e.dec_deg.toFixed(6)}</td>
            <td>${e.mag != null ? e.mag.toFixed(2) : ''}</td>
            <td><button data-name="${e.name}">Goto</button></td>
          `;
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('button[data-name]').forEach(btn => {
          btn.addEventListener('click', async () => {
            try {
              const nm = btn.getAttribute('data-name');
              const j2 = await api('/api/goto-name?name=' + encodeURIComponent(nm), { method: 'POST' });
              alert('GOTO: ' + JSON.stringify(j2));
            } catch (e) { alert(e.message); }
          });
        });
      } catch (e) {
        alert(e.message);
      }
    }

    async function gotoByName() {
      try {
        const name = document.getElementById('nameGoto').value.trim();
        const j = await api('/api/goto-name?name=' + encodeURIComponent(name), { method: 'POST' });
        document.getElementById('gotoNameRes').textContent = JSON.stringify(j);
      } catch (e) { alert(e.message); }
    }

    document.getElementById('findBtn').onclick = find;
    document.getElementById('gotoNameBtn').onclick = gotoByName;
  </script>
</body>
</html>
