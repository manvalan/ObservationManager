<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allineamento</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .35rem; }
    th { background: #f5f5f5; text-align: left; }
    .status { padding: .5rem; background: #f8f8f8; border: 1px solid #ddd; border-radius: 6px; margin: .5rem 0; }
    .flex { display: flex; gap: 1rem; flex-wrap: wrap; }
    iframe, img { max-width: 100%; }
  </style>
</head>
<body>
  <h1>Allineamento 1-3 stelle</h1>
  <p><a href="index.html">Home</a></p>

  <div class="status" id="session"></div>

  <section class="flex">
    <div style="flex:2 1 360px;">
      <h3>Stelle suggerite (sopra l'orizzonte)</h3>
      <button id="refresh">Aggiorna</button>
      <table>
        <thead>
          <tr><th>#</th><th>Nome</th><th>Alt</th><th>Az</th><th>Mag</th><th>Azioni</th></tr>
        </thead>
        <tbody id="suggestions"></tbody>
      </table>
    </div>
    <div style="flex:1 1 320px;">
      <h3>Camera</h3>
      <div class="status">Stream MJPEG da /api/video.mjpg</div>
      <div style="position:relative; display:inline-block;">
        <img id="cam" src="/api/video.mjpg" alt="Camera" />
        <div id="reticle" style="position:absolute; top:50%; left:50%; width:40px; height:40px; margin-left:-20px; margin-top:-20px; border:1px solid red; box-sizing:border-box; pointer-events:none;"></div>
        <div style="position:absolute; top:50%; left:50%; width:2px; height:80px; margin-left:-1px; margin-top:-40px; background:red; opacity:0.6; pointer-events:none;"></div>
        <div style="position:absolute; top:50%; left:50%; width:80px; height:2px; margin-left:-40px; margin-top:-1px; background:red; opacity:0.6; pointer-events:none;"></div>
      </div>
      <div style="margin-top:.4rem;">
        Camera index: <input id="camIndex" type="number" value="0" style="width:60px" />
        <button id="camStart">Start</button>
      </div>
    </div>
  </section>

  <section>
    <h3>Sync manuale</h3>
    <div>
      RA (deg): <input id="syncRa" type="number" step="0.0001" />
      Dec (deg): <input id="syncDec" type="number" step="0.0001" />
      <button id="syncBtn">Sync (CM)</button>
      Countdown (s): <input id="countdown" type="number" value="0" style="width:60px" />
      <button id="syncCountdownBtn">Sync dopo countdown</button>
    </div>
    <div class="status" id="syncRes"></div>
  </section>

  <script>
    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      return res.json();
    }

    async function loadSuggestions() {
      const j = await api('/api/align/suggestions?limit=8&min_alt=20');
      const tbody = document.getElementById('suggestions');
      tbody.innerHTML = '';
      (j.results || []).forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i+1}</td>
          <td>${s.name}</td>
          <td>${s.alt_deg.toFixed(1)}°</td>
          <td>${s.az_deg.toFixed(1)}°</td>
          <td>${s.mag ?? ''}</td>
          <td><button data-name="${s.name}" data-ra="${s.ra_deg}" data-dec="${s.dec_deg}">GOTO</button></td>
        `;
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('button[data-name]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            const name = btn.getAttribute('data-name');
            const ra_deg = parseFloat(btn.getAttribute('data-ra'));
            const dec_deg = parseFloat(btn.getAttribute('data-dec'));
            const j2 = await api('/api/align/goto', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, ra_deg, dec_deg }) });
            alert('GOTO: ' + JSON.stringify(j2));
            await refreshSession();
          } catch (e) { alert(e.message); }
        });
      });
    }

    async function refreshSession() {
      const j = await api('/api/align/status');
      document.getElementById('session').textContent = JSON.stringify(j.session, null, 2);
    }

    document.getElementById('refresh').onclick = loadSuggestions;
    document.getElementById('syncBtn').onclick = async () => {
      try {
        const ra_deg = parseFloat(document.getElementById('syncRa').value);
        const dec_deg = parseFloat(document.getElementById('syncDec').value);
        const j = await api('/api/align/sync', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ra_deg, dec_deg }) });
        document.getElementById('syncRes').textContent = JSON.stringify(j);
        await refreshSession();
      } catch (e) { alert(e.message); }
    };

    document.getElementById('syncCountdownBtn').onclick = () => {
      const sec = parseFloat(document.getElementById('countdown').value||'0');
      if (sec <= 0) {
        document.getElementById('syncBtn').click();
        return;
      }
      let remaining = sec;
      document.getElementById('syncRes').textContent = `Countdown: ${remaining.toFixed(1)}s`;
      const timer = setInterval(async () => {
        remaining -= 0.5;
        if (remaining <= 0) {
          clearInterval(timer);
          document.getElementById('syncBtn').click();
        } else {
          document.getElementById('syncRes').textContent = `Countdown: ${remaining.toFixed(1)}s`;
        }
      }, 500);
    };

    document.getElementById('camStart').onclick = () => {
      const idx = parseInt(document.getElementById('camIndex').value||'0', 10);
      const cam = document.getElementById('cam');
      cam.src = '/api/video.mjpg?camera_index=' + idx + '&_t=' + Date.now();
    };

    loadSuggestions().then(refreshSession);
  </script>
</body>
</html>
